services:
  dsh-harbor:
    build: .
    image: dsh-harbor:latest
    container_name: dsh-harbor
    restart: unless-stopped
    environment:
      # 站点绝对地址：canonical / OG / sitemap / 徽章 Markdown 都用它，必须填对
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?请在 .env 里设置 NEXT_PUBLIC_SITE_URL}
      # 有 token 才能稳定跑提交预检与同步，没有会吃匿名限流
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # 提交写盘目录（容器内）
      HARBOR_DATA_DIR: /app/data
      # 同一 IP 每小时最多几次提交
      HARBOR_SUBMIT_PER_HOUR: ${HARBOR_SUBMIT_PER_HOUR:-8}
      # 是否强制要求仓库声明开源许可证
      HARBOR_REQUIRE_LICENSE: ${HARBOR_REQUIRE_LICENSE:-true}
      TZ: Asia/Shanghai
    volumes:
      # 目录真源挂到宿主机，容器重建不丢数据，也方便直接改 / git diff
      - ./data:/app/data
    expose:
      - "3000"
    ports:
      # 本机调试用；有 Caddy 时可以直接删掉这一行
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: dsh-harbor-caddy
    restart: unless-stopped
    depends_on:
      - dsh-harbor
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 里设置 SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?请在 .env 里设置 ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
